<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Taegeuk Gradients -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2979ff"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#262626" stroke-width="4"/>

  <!-- Glowing Accent Outer Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00e676" stroke-width="5" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00e676" stroke-width="3" stroke-dasharray="28 14" stroke-opacity="0.6"/>

  <!-- Korean Character 'ㅎ' Structure -->
  <g filter="url(#neonGlow)">
    <!-- 1. Top Dot/Short Stroke -->
    <line x1="256" y1="120" x2="256" y2="148" stroke="#00e676" stroke-width="22" stroke-linecap="round"/>

    <!-- 2. Horizontal Bar -->
    <line x1="160" y1="185" x2="352" y2="185" stroke="#00e676" stroke-width="24" stroke-linecap="round"/>

    <!-- 3. Taegeuk Circle Base (Korean Yin-Yang as the bottom circle of ㅎ) -->
    <g transform="translate(256, 315)">
      <!-- Outer Mask Ring for neon accent -->
      <circle cx="0" cy="0" r="76" fill="none" stroke="#00e676" stroke-width="6"/>

      <!-- Red Upper Swirl -->
      <path d="M -70,0 A 70,70 0 0,1 70,0 A 35,35 0 0,1 0,0 A 35,35 0 0,0 -70,0 Z" fill="url(#redGrad)"/>

      <!-- Blue Lower Swirl -->
      <path d="M 70,0 A 70,70 0 0,1 -70,0 A 35,35 0 0,1 0,0 A 35,35 0 0,0 70,0 Z" fill="url(#blueGrad)"/>

      <!-- Center Dynamic Cutout to maintain Hangeul 'ㅇ' readability -->
      <circle cx="0" cy="0" r="22" fill="#1b1b1b"/>
    </g>
  </g>
</svg>
